<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Busca | Cuidar Seguro</title>
  <meta name="description" content="Busque temas, artigos, protocolos e recursos sobre segurança do paciente no Cuidar Seguro.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fraunces:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root{--verde:#1a5c8a;--verde-claro:#2a8fcc;--creme:#f0f7fc;--texto:#1c2b3a;--texto-leve:#3a5a72;--borda:#b8d8ed;--verde-suave:#e8f4fb;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--creme);color:var(--texto);min-height:100vh;}
    a{color:inherit;text-decoration:none;}
    nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 3rem;background:rgba(240,247,252,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--borda);}
    .nav-logo img{height:40px;width:auto;display:block;}
    .nav-back{display:flex;align-items:center;gap:0.5rem;color:var(--texto-leve);font-size:0.9rem;font-weight:500;transition:color 0.2s;}
    .nav-back:hover{color:var(--verde);}
    main{max-width:800px;margin:0 auto;padding:3rem 1.5rem 5rem;}
    h1{font-family:'Fraunces',serif;font-size:2rem;font-weight:600;color:var(--texto);margin-bottom:0.5rem;}
    .busca-sub{color:var(--texto-leve);font-size:1rem;margin-bottom:2rem;}
    .busca-form{display:flex;gap:0.75rem;margin-bottom:0.5rem;}
    .busca-input{flex:1;padding:0.85rem 1.2rem;border:2px solid var(--borda);border-radius:2rem;font-family:inherit;font-size:1rem;color:var(--texto);background:white;outline:none;transition:border-color 0.2s;}
    .busca-input:focus{border-color:var(--verde);}
    .busca-filtros{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:2rem;}
    .filtro-btn{padding:0.3rem 0.9rem;border:1.5px solid var(--borda);border-radius:2rem;background:white;color:var(--texto-leve);font-size:0.82rem;font-weight:500;cursor:pointer;transition:all 0.15s;font-family:inherit;}
    .filtro-btn.ativo,.filtro-btn:hover{border-color:var(--verde);background:var(--verde);color:white;}
    #busca-count{font-size:0.85rem;color:var(--texto-leve);margin-bottom:1.5rem;min-height:1.2em;}
    #busca-resultados{display:flex;flex-direction:column;gap:1rem;}
    .resultado-card{background:white;border:1.5px solid var(--borda);border-radius:1rem;padding:1.2rem 1.4rem;transition:all 0.2s;display:block;}
    .resultado-card:hover{border-color:var(--verde);box-shadow:0 4px 16px rgba(26,92,138,0.1);transform:translateY(-1px);}
    .res-meta{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.4rem;}
    .res-tipo{font-size:0.72rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:0.2rem 0.6rem;border-radius:0.5rem;}
    .tipo-Artigo{background:#e8f4fb;color:#1a5c8a;}
    .tipo-Tema{background:#e8faf0;color:#1a7a55;}
    .tipo-Recurso{background:#fff8e0;color:#8a5c1a;}
    .tipo-Atividade{background:#f5e8fb;color:#6b1a8a;}
    .res-title{font-size:1rem;font-weight:600;color:var(--texto);margin-bottom:0.35rem;line-height:1.3;}
    .res-body{font-size:0.85rem;color:var(--texto-leve);line-height:1.5;}
    .estado-inicial,.estado-vazio{text-align:center;padding:4rem 1rem;color:var(--texto-leve);}
    .estado-inicial .ico,.estado-vazio .ico{font-size:3rem;margin-bottom:1rem;}
    .estado-inicial p,.estado-vazio p{font-size:1rem;line-height:1.6;}
    @media(max-width:600px){nav{padding:1rem 1.2rem;}main{padding:2rem 1rem 4rem;}h1{font-size:1.5rem;}.busca-form{flex-direction:column;}.busca-input{border-radius:1rem;}}
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo"><img src="logo_cuidarseguro.webp" alt="Cuidar Seguro"></a>
  <a href="index.html" class="nav-back">← Voltar ao início</a>
</nav>
<main>
  <h1>Busca</h1>
  <p class="busca-sub">Pesquise temas, artigos, protocolos e recursos</p>
  <div class="busca-form">
    <input type="search" id="busca-input" class="busca-input" placeholder="Ex: higiene das mãos, sepse, checklist…" autocomplete="off" spellcheck="false" aria-label="Campo de busca">
  </div>
  <div class="busca-filtros" id="busca-filtros" role="group" aria-label="Filtrar por tipo">
    <button class="filtro-btn ativo" data-tipo="">Todos</button>
    <button class="filtro-btn" data-tipo="Artigo">Artigos</button>
    <button class="filtro-btn" data-tipo="Tema">Temas</button>
    <button class="filtro-btn" data-tipo="Recurso">Recursos</button>
    <button class="filtro-btn" data-tipo="Atividade">Atividades</button>
  </div>
  <div id="busca-count" aria-live="polite"></div>
  <div id="busca-resultados">
    <div class="estado-inicial"><div class="ico">🔍</div><p>Digite acima para buscar em temas, artigos,<br>protocolos e recursos do Cuidar Seguro.</p></div>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lunr.js/2.3.9/lunr.min.js"></script>
<script>
(function(){
  var docs=[];
  var idx=null;
  var filtroAtivo='';

  fetch('search-index.json')
    .then(function(r){return r.json();})
    .then(function(data){
      docs=data;
      idx=lunr(function(){
        this.ref('id');
        this.field('title',{boost:10});
        this.field('body');
        data.forEach(function(d){this.add(d);},this);
      });
      // se veio query pela URL, dispara
      var params=new URLSearchParams(window.location.search);
      var q=params.get('q');
      if(q){
        var inp=document.getElementById('busca-input');
        inp.value=q;
        buscar(q);
      }
    })
    .catch(function(){
      document.getElementById('busca-resultados').innerHTML='<p style="color:#c0392b;padding:2rem">Não foi possível carregar o índice de busca.</p>';
    });

  function buscar(q){
    var cont=document.getElementById('busca-resultados');
    var count=document.getElementById('busca-count');
    q=q.trim();
    if(!q){cont.innerHTML='<div class="estado-inicial"><div class="ico">🔍</div><p>Digite acima para buscar em temas, artigos,<br>protocolos e recursos do Cuidar Seguro.</p></div>';count.textContent='';return;}
    if(!idx){count.textContent='Carregando…';return;}
    var resultIds;
    try{
      // busca com wildcard no ultimo token
      var tokens=q.toLowerCase().split(/\s+/).filter(Boolean);
      var query=tokens.map(function(t,i){return i===tokens.length-1?t+'*':t;}).join(' ');
      resultIds=idx.search(query).map(function(r){return r.ref;});
      // fallback sem wildcard se vazio
      if(!resultIds.length) resultIds=idx.search(q).map(function(r){return r.ref;});
    }catch(e){resultIds=[];}

    var filtrados=resultIds
      .map(function(id){return docs.find(function(d){return d.id===id;});})
      .filter(function(d){return d&&(!filtroAtivo||d.type===filtroAtivo);});

    if(!filtrados.length){
      cont.innerHTML='<div class="estado-vazio"><div class="ico">😕</div><p>Nenhum resultado para <strong>'+esc(q)+'</strong>'+(filtroAtivo?' ('+esc(filtroAtivo)+')')+'.<br>Tente outros termos ou remova o filtro.</p></div>';
      count.textContent='';return;
    }
    count.textContent=filtrados.length+' resultado'+(filtrados.length>1?'s':'');
    cont.innerHTML=filtrados.map(function(d){
      var externo=d.url.startsWith('http');
      return '<a class="resultado-card" href="'+esc(d.url)+'"'+(externo?' target="_blank" rel="noopener noreferrer"':'')+'>'
        +'<div class="res-meta"><span class="res-tipo tipo-'+esc(d.type)+'">'+esc(d.type)+'</span>'+(externo?'<span style="font-size:0.75rem;color:var(--texto-leve);">↗ externo</span>':'')+'</div>'
        +'<div class="res-title">'+esc(d.title)+'</div>'
        +'<div class="res-body">'+esc(d.body.substring(0,140))+'…</div>'
        +'</a>';
    }).join('');
  }

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var timer;
  document.getElementById('busca-input').addEventListener('input',function(){
    clearTimeout(timer);
    var q=this.value;
    timer=setTimeout(function(){buscar(q);},150);
  });

  document.getElementById('busca-filtros').addEventListener('click',function(e){
    var btn=e.target.closest('.filtro-btn');
    if(!btn)return;
    document.querySelectorAll('.filtro-btn').forEach(function(b){b.classList.remove('ativo');});
    btn.classList.add('ativo');
    filtroAtivo=btn.dataset.tipo;
    buscar(document.getElementById('busca-input').value);
  });
})();
</script>
</body>
</html>
